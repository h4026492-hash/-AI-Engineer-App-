[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-engineer-app"
version = "0.2.0"
description = "Offline, source-grounded plain-language health education demo built with FastAPI and RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineer App" }]
keywords = ["ai", "llm", "rag", "fastapi", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
ai-app = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: tests that hit a real external service (deselected in CI by default)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "SLF", # flake8-self: private member access must be deliberate (noqa)
    "T20", # flake8-print (no stray prints in library code)
    "RUF", # ruff-specific
]
ignore = ["E501"] # line length is enforced by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# These are executables, not library code: printing is their interface.
"evals/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true
